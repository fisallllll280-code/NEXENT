name: NEXENT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q nexent tests
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          python -m nexent.cli status
          python -m nexent.cli demo

  rust:
    name: Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path rust/nexent-evidence/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/nexent-evidence/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/nexent-evidence/Cargo.toml
