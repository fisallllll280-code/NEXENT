name: NEXENT Intent Web Verification

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Web tests
        run: python -m pytest -q tests/test_intent_web.py
      - name: CLI smoke
        run: python -m nexent.cli status
