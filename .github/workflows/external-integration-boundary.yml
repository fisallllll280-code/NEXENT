name: NEXENT External Integration Boundary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Boundary test
        run: python -m pytest -q tests/test_external_integration_boundary.py
